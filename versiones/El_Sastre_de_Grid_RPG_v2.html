<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Sastre de Grid RPG v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=VT323&display=swap">
<style>
/* RPG clásico 16 bits: el lienzo dibuja el mundo; las ventanas azules (HTML) llevan el texto. Tema único oscuro, deliberado. */
:root {
  --fondo: #050608;
  --win-a: #2b3c94; --win-b: #0c1342; --borde: #e9e9f2;
  --texto: #f3f1e8; --tenue: #a7acd0; --oro: #f0c060; --verde: #8fe0a4; --rojo: #ff7766; --ambar: #ffd166;
  --f-pixel: "VT323", ui-monospace, "Courier New", monospace;
  --f-titulo: "Cormorant Garamond", Georgia, serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--fondo); color: var(--texto); font-family: var(--f-pixel); overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
#wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
#stage { position: relative; background: #000; overflow: hidden; flex: none; }
#cv { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

.win { position: absolute; background: linear-gradient(180deg, var(--win-a), var(--win-b)); border: 2px solid var(--borde); border-radius: 6px;
  box-shadow: inset 0 0 0 2px #0a1036, 0 3px 0 rgba(0,0,0,.6); padding: .3em .55em; line-height: 1.02; font-size: 1em; }
.name { color: var(--oro); }
#dlg { left: 2%; right: 2%; bottom: 2%; min-height: 31%; cursor: pointer; }
#dlg .txt { margin-top: .15em; white-space: pre-wrap; }
#dlg .more { position: absolute; right: .5em; bottom: .2em; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.list { padding: .25em .5em .3em 1.2em; }
.list .ttl { color: var(--oro); margin: 0 0 .15em -.7em; }
.opt { position: relative; cursor: pointer; display: flex; justify-content: space-between; gap: 1em; white-space: nowrap; }
.opt.on::before { content: "▶"; position: absolute; left: -1em; color: var(--texto); }
.opt.dis { color: #6d7299; }
.opt span { color: var(--tenue); }
.scroll { overflow-y: auto; max-height: 100%; }
#choice { right: 3%; bottom: 35%; min-width: 46%; }
#menu { right: 2%; top: 3%; min-width: 34%; }
#info { left: 2%; top: 3%; right: 38%; }
#info .row { display: grid; grid-template-columns: 1fr auto; gap: .1em 1em; margin-bottom: .35em; }
#loc { left: 3%; top: 3%; padding: .2em .6em; font-size: .9em; transition: opacity .6s; }
#toast { left: 50%; top: 40%; transform: translateX(-50%); text-align: center; white-space: nowrap; }

/* combate */
#bEnemy { left: 1%; bottom: 1%; width: 35%; height: 28%; font-size: .82em; overflow: hidden; }
#bParty { right: 1%; bottom: 1%; width: 63%; height: 28%; font-size: .88em; display: flex; flex-direction: column; justify-content: center; gap: .08em; }
.prow { display: grid; grid-template-columns: 4.3em 1fr 2.6em 3.2em; gap: .4em; align-items: center; padding-left: .9em; position: relative; }
.prow.ready::before { content: "▶"; position: absolute; left: 0; color: var(--ambar); }
.prow .hp.low { color: var(--ambar); } .prow .hp.ko { color: var(--rojo); }
.prow .mp { color: var(--tenue); text-align: right; }
.atb { height: .45em; border: 1px solid #c8c8e0; background: #10164a; }
.atb i { display: block; height: 100%; background: #9fb4ff; }
.atb.lleno i { background: var(--ambar); }
.amaru { padding-left: .9em; display: grid; grid-template-columns: 4.3em 1fr; gap: .4em; align-items: center; color: var(--oro); font-size: .9em; }
.amaru .atb i { background: linear-gradient(90deg, #2d6b40, #f0c060); }
#bCmd { left: 1%; bottom: 1%; min-width: 35%; }
#bSub { left: 1%; bottom: 1%; width: 64%; max-height: 62%; }
#bMsg { left: 50%; top: 3%; transform: translateX(-50%); white-space: nowrap; text-align: center; }

/* pantallas completas */
.full { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: .6em; padding: 4%; }
#title h1 { font-family: var(--f-titulo); font-weight: 600; font-size: 3.3em; line-height: .9; margin: 0; text-shadow: 0 3px 0 #000, 0 0 18px rgba(0,0,0,.8); letter-spacing: .01em; }
#title h1 i { font-weight: 500; color: var(--verde); }
#title .kick { color: var(--oro); letter-spacing: .18em; font-size: .9em; text-shadow: 0 2px 0 #000; }
#title .win, #over .win, #end .win { position: static; }
#title .hint, .hint { font-size: .78em; color: var(--tenue); text-shadow: 0 2px 0 #000; }
#end, #over { background: rgba(3,4,10,.86); }
#end h2, #over h2 { font-family: var(--f-titulo); font-weight: 600; font-size: 2.5em; line-height: .95; margin: 0; }
#end p, #over p { max-width: 30em; margin: 0; line-height: 1.1; }
#end .stats { display: flex; flex-wrap: wrap; justify-content: center; gap: .2em 1.2em; color: var(--oro); }
#end .stats span { white-space: nowrap; }

/* controles táctiles */
#pad { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; max-width: 560px; padding: 0 14px 10px; flex: none; }
.dpad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); }
.pb { border: 2px solid #6870a8; background: #161c4a; color: var(--texto); font: inherit; font-size: 22px; border-radius: 10px; touch-action: none; }
.pb:active, .pb.down { background: #2b3c94; }
.dpad .u { grid-area: 1 / 2; } .dpad .l { grid-area: 2 / 1; } .dpad .r { grid-area: 2 / 3; } .dpad .d { grid-area: 3 / 2; }
.ab { display: flex; gap: 10px; align-items: center; }
.ab .pb { width: 56px; height: 56px; border-radius: 50%; font-size: 24px; }
.ab .a { background: #3a2a10; border-color: #c89a40; } .ab .b { background: #301418; border-color: #b05a62; }
.mid { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.mid .pb { font-size: 15px; padding: 6px 10px; border-radius: 999px; }
#keys { color: var(--tenue); font-size: 15px; text-align: center; padding: 0 16px 8px; }

/* retratos manga en el diálogo */
#dlg.con-retrato { padding-left: 6.35em; min-height: 6.3em; }
#dlgPic { position: absolute; left: .32em; top: .32em; width: 5.6em; height: 5.6em; border: 2px solid var(--borde); border-radius: 3px; overflow: hidden; background: #000; box-shadow: inset 0 0 0 1px #000; }
#dlgPic svg { display: block; width: 100%; height: 100%; }
#dlg.con-retrato #dlgPic.entra { animation: entra .18s steps(3); }
@keyframes entra { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0); } }
</style>

<div id="wrap">
  <div id="stage">
    <canvas id="cv" width="256" height="224"></canvas>
    <div class="win" id="loc" hidden></div>
    <div class="win" id="toast" hidden></div>
    <div class="win" id="dlg" hidden><div id="dlgPic" hidden></div><div class="name" id="dlgName"></div><div class="txt" id="dlgTxt"></div><div class="more" id="dlgMore">▼</div></div>
    <div class="win list" id="choice" hidden></div>
    <div class="win" id="info" hidden></div>
    <div class="win list" id="menu" hidden></div>
    <div class="win" id="bEnemy" hidden></div>
    <div class="win" id="bParty" hidden></div>
    <div class="win list" id="bCmd" hidden></div>
    <div class="win list scroll" id="bSub" hidden></div>
    <div class="win" id="bMsg" hidden></div>

    <section class="full" id="title">
      <div class="kick">CRÓNICAS DE LA LIMA DESPIERTA</div>
      <h1>El Sastre<br><i>de Grid</i></h1>
      <div class="win list" id="titleMenu"></div>
      <div class="hint" id="titleHint"></div>
    </section>
    <section class="full" id="over" hidden>
      <h2>Lima se queda a oscuras</h2>
      <p>Grid encontró a todos. Esta vez.</p>
      <div class="win list" id="overMenu"></div>
    </section>
    <section class="full" id="end" hidden>
      <div class="kick" id="endKick" style="color:var(--oro);letter-spacing:.16em"></div>
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <div class="stats" id="endStats"></div>
      <div class="win list" id="endMenu"></div>
    </section>
  </div>
  <div id="pad" hidden>
    <div class="dpad">
      <button class="pb u" data-k="up" aria-label="Arriba">▲</button><button class="pb l" data-k="left" aria-label="Izquierda">◀</button>
      <button class="pb r" data-k="right" aria-label="Derecha">▶</button><button class="pb d" data-k="down" aria-label="Abajo">▼</button>
    </div>
    <div class="mid"><button class="pb" data-k="menu">Menú</button><button class="pb" id="musBtn" type="button" aria-label="Música">♪</button></div>
    <div class="ab"><button class="pb b" data-k="b" aria-label="Cancelar">B</button><button class="pb a" data-k="a" aria-label="Aceptar">A</button></div>
  </div>
  <div id="keys" hidden>Flechas o WASD: moverse · Z, Enter o Espacio: aceptar · X o Esc: cancelar · M: menú</div>
</div>

/* imágenes de fondo (se pixelan al dibujarlas) */
const IMG = {};
['calle', 'plaza', 'sombra', 'boveda', 'huaca', 'viejo', 'cerro'].forEach(n => { const i = new Image(); i.src = `../img/${n}.jpg`; IMG[n] = i; });
function pixelate(name, w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  const im = IMG[name];
  if (im && im.complete && im.naturalWidth) {
    const r = Math.max(w / im.naturalWidth, h / im.naturalHeight), iw = im.naturalWidth * r, ih = im.naturalHeight * r;
    g.drawImage(im, (w - iw) / 2, (h - ih) / 2, iw, ih);
    try { const d = g.getImageData(0, 0, w, h), a = d.data; // reducir paleta: aspecto 16 bits
      for (let i = 0; i < a.length; i += 4) for (let k = 0; k < 3; k++) a[i + k] = Math.round(a[i + k] / 24) * 24;
      g.putImageData(d, 0, 0); } catch (e) {}
  } else { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#0d1428'); gr.addColorStop(1, '#05060a'); g.fillStyle = gr; g.fillRect(0, 0, w, h); }
  return c;
}

function drawChar(c, x, y, s, dir = 0, fr = 0, sc = 1, alpha = 1) {

  if (s.wings) { px(c, 0, 6, 3, 5, '#2a2030'); px(c, 13, 6, 3, 5, '#2a2030'); }
  // piernas
  if (s.tail) { px(c, 5, 11, 6, 3, s.tail); px(c, 3, 14, 4, 1, s.tail); px(c, 9, 13, 4, 1, s.tail); }
  else if (dir === 0 || dir === 3) { px(c, 5, 12, 2, wk === 1 ? 2 : 3, s.legs); px(c, 9, 12, 2, wk === 2 ? 2 : 3, s.legs); }
  else { px(c, 6 + (wk === 1 ? -1 : 0), 12, 2, 3, s.legs); px(c, 8 + (wk === 2 ? 1 : 0), 12, 2, 3, s.legs); }

    case 'braid': px(c, 4, 0, 8, 2, hc); if (dir === 3) { px(c, 4, 0, 8, 6, hc); px(c, 7, 6, 2, 7, hc); } else if (dir === 1) { px(c, 8, 0, 4, 5, hc); px(c, 11, 4, 2, 7, hc); } else if (dir === 2) { px(c, 4, 0, 4, 5, hc); px(c, 3, 4, 2, 7, hc); } else { px(c, 4, 2, 1, 3, hc); px(c, 11, 2, 1, 3, hc); } break;
    case 'bald': px(c, 4, 3, 1, 3, hc); px(c, 11, 3, 1, 3, hc); if (dir === 3) px(c, 4, 4, 8, 2, hc); break;
    case 'veil': px(c, 3, 0, 10, 3, '#222'); px(c, 3, 3, 2, 8, '#222'); px(c, 11, 3, 2, 8, '#222'); if (dir === 3) px(c, 3, 0, 10, 10, '#222'); break;
    case 'helmet': px(c, 3, 0, 10, 3, '#3b4a36'); px(c, 3, 3, 1, 2, '#3b4a36'); px(c, 12, 3, 1, 2, '#3b4a36'); if (dir === 3) px(c, 3, 0, 10, 6, '#3b4a36'); break;
  }
  if (s.band) { px(c, 4, 2, 8, 1, s.band); if (dir !== 0) px(c, dir === 2 ? 3 : 12, 2, 1, 3, s.band); }
  if (dir !== 3) {
    const e = '#121212';
    if (dir === 0) { px(c, 6, 4, 1, 1, e); px(c, 9, 4, 1, 1, e); }
    else if (dir === 1) px(c, 5, 4, 1, 1, e); else px(c, 10, 4, 1, 1, e);
    if (s.glasses) { px(c, dir === 2 ? 7 : 4, 4, dir === 0 ? 8 : 5, 1, '#050505'); }
    if (s.style === 'helmet' && dir === 0) px(c, 4, 3, 8, 2, 'rgba(10,20,10,.85)');
    if (s.ghost && dir === 0) px(c, 7, 2, 2, 1, '#300');
  }
  c.restore();
}

function makeMember(id, lv = 1) {
  const D = MEMBERS[id], m = { id, name: D.name, lv: 1, xp: 0, skills: [], ...structuredClone(D.base) };
  m.hp = m.mhp; m.mp = m.mmp; (D.learn[1] || []).forEach(s => m.skills.push(s));
  while (m.lv < lv) levelUp(m, true);
  m.xp = lv > 1 ? xpTo(lv - 1) : 0; m.hp = m.mhp; m.mp = m.mmp; return m;
}
function levelUp(m, silent) {
  const g = MEMBERS[m.id].gr; m.lv++;
  for (const k in g) m[k] += g[k] + (k === 'mhp' ? rand(0, 3) : 0);
  const learned = (MEMBERS[m.id].learn[m.lv] || []).filter(s => !m.skills.includes(s));
  learned.forEach(s => m.skills.push(s)); return learned;
}

function tileAt(x, y) { if (!M || y < 0 || x < 0 || y >= M.h || x >= M.w) return '|'; return M.grid[y][x]; }

const handlers = [];
const held = new Set();
function pushH(h) { handlers.push(h); }
function popH(h) { const i = handlers.lastIndexOf(h); if (i >= 0) handlers.splice(i, 1); }
function press(b) { const h = handlers[handlers.length - 1]; if (h) h(b); else if (MODE === 'map' && !busy) mapPress(b); }
const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right',
  z: 'a', Z: 'a', Enter: 'a', ' ': 'a', x: 'b', X: 'b', Escape: 'b', Backspace: 'b', m: 'menu', M: 'menu' };
addEventListener('keydown', e => { const b = KEYMAP[e.key]; if (!b) return; e.preventDefault(); if (['up', 'down', 'left', 'right'].includes(b)) held.add(b); if (!e.repeat || ['up', 'down'].includes(b) && handlers.length) press(b); });
addEventListener('keyup', e => { const b = KEYMAP[e.key]; if (b) held.delete(b); });
addEventListener('blur', () => held.clear());
document.querySelectorAll('#pad [data-k]').forEach(btn => {
  const k = btn.dataset.k;
  btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.classList.add('down'); if (['up', 'down', 'left', 'right'].includes(k)) held.add(k); press(k); });
  const up = () => { btn.classList.remove('down'); held.delete(k); };
  btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', up); btn.addEventListener('pointerleave', up);
});

let retratoActual = null;
function ponerRetrato(name) {
  const pic = $('dlgPic'), d = $('dlg'), svg = RETRATOS[name];
  d.classList.toggle('con-retrato', !!svg); pic.hidden = !svg;
  if (svg && retratoActual !== name) { pic.innerHTML = svg; pic.classList.remove('entra'); void pic.offsetWidth; pic.classList.add('entra'); }
  retratoActual = svg ? name : null;
}
function say(name, text) {
  return new Promise(res => {
    const d = $('dlg'); d.hidden = false; ponerRetrato(name); $('dlgName').textContent = name || ''; $('dlgName').hidden = !name;
    const el = $('dlgTxt'); el.style.color = name === 'Julián' ? 'var(--verde)' : name === 'GRID' ? 'var(--oro)' : '';
    let i = 0, done = false; $('dlgMore').hidden = true;
    const iv = setInterval(() => { i += 2; el.textContent = text.slice(0, i); if (i % 6 === 0) blip(); if (i >= text.length) finish(); }, 22);
    function finish() { clearInterval(iv); el.textContent = text; done = true; $('dlgMore').hidden = false; }
    function h(b) { if (b !== 'a' && b !== 'b') return; if (!done) return finish(); popH(h); d.hidden = true; d.onclick = null; res(); }
    d.onclick = () => h('a'); pushH(h);
  });
}
function listMenu(el, items, opt = {}) {
  return new Promise(res => {
    let i = items.findIndex(x => !x.disabled); if (i < 0) i = 0;
    el.hidden = false;
    function render() {
      el.innerHTML = (opt.title ? `<div class="ttl">${esc(opt.title)}</div>` : '') + items.map((it, k) =>
        `<div class="opt${k === i ? ' on' : ''}${it.disabled ? ' dis' : ''}" data-k="${k}">${esc(it.label)}${it.right != null ? `<span>${esc(it.right)}</span>` : ''}</div>`).join('');
      el.querySelectorAll('.opt').forEach(o => { o.onclick = () => { const k = +o.dataset.k; if (items[k].disabled) return; i = k; done(k); }; o.onpointerenter = () => { i = +o.dataset.k; if (opt.onHover) opt.onHover(i); }; });
      const on = el.querySelector('.opt.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
      if (opt.onHover) opt.onHover(i);
    }
    function h(b) {
      if (b === 'up' || b === 'left') { i = (i - 1 + items.length) % items.length; sfx('cursor'); render(); }
      else if (b === 'down' || b === 'right') { i = (i + 1) % items.length; sfx('cursor'); render(); }
      else if (b === 'a') { if (!items[i].disabled) done(i); else sfx('cancel'); }
      else if (b === 'b' && opt.cancel !== false) done(-1);
    }
    function done(k) { popH(h); el.hidden = true; el.innerHTML = ''; sfx(k < 0 ? 'cancel' : 'ok'); res(k); }
    render(); pushH(h);
  });
}
async function choose(opts) { return listMenu($('choice'), opts.map(t => ({ label: t })), { cancel: false }); }
let locTimer = null;
function showLoc(name) { const l = $('loc'); l.textContent = name; l.hidden = false; l.style.opacity = 1; clearTimeout(locTimer); locTimer = setTimeout(() => { l.style.opacity = 0; setTimeout(() => l.hidden = true, 600); }, 2200); }
async function toast(text, ms = 1400) { const t = $('toast'); t.textContent = text; t.hidden = false; await sleep(ms); t.hidden = true; }
let fadeV = 0, fadeTarget = 0;
function fade(to) { fadeTarget = to; return new Promise(r => { const iv = setInterval(() => { if (Math.abs(fadeV - fadeTarget) < .02) { fadeV = fadeTarget; clearInterval(iv); r(); } }, 16); }); }
let shake = 0;

/* =====================================================================
   Mapa: movimiento, interacción, eventos
   ===================================================================== */
const DV = { 0: [0, 1], 1: [-1, 0], 2: [1, 0], 3: [0, -1] };
const DIRK = { down: 0, left: 1, right: 2, up: 3 };
function npcsHere() { return (NPCS[M.id] || []).filter(n => !n.show || n.show()); }
function npcAt(x, y) { return npcsHere().find(n => n.x === x && n.y === y); }
function walkable(x, y) { const ch = tileAt(x, y); return !SOLID.has(ch) && !npcAt(x, y); }

function updateMap(dt) {
  if (P.moving) {
    P.t += dt * 5.2; P.fr = Math.floor(P.t * 4) % 4 || 1;
    const k = Math.min(1, P.t);
    P.fx = (P.from[0] + (P.to[0] - P.from[0]) * k) * T; P.fy = (P.from[1] + (P.to[1] - P.from[1]) * k) * T;
    const f = P.follower; if (f.from) { f.fx = (f.from[0] + (f.x - f.from[0]) * k) * T; f.fy = (f.from[1] + (f.y - f.from[1]) * k) * T; }
    if (P.t >= 1) { P.moving = false; P.x = P.to[0]; P.y = P.to[1]; P.fr = 0; onStep(); }
    return;
  }
  if (busy || handlers.length) return;
  const d = ['up', 'down', 'left', 'right'].find(k => held.has(k)); if (!d) return;
  P.dir = DIRK[d]; const [dx, dy] = DV[P.dir], nx = P.x + dx, ny = P.y + dy;
  const ch = tileAt(nx, ny);
  const door = (DOORS[M.id] || {})[nx + ',' + ny];
  if (door) { held.clear(); run(door); return; }
  if (walkable(nx, ny)) {
    P.moving = true; P.t = 0; P.from = [P.x, P.y]; P.to = [nx, ny];
    const f = P.follower; f.from = [f.x, f.y]; f.dir = P.dir; f.x = P.x; f.y = P.y; f.dir = P.dir;
  }
}
function onStep() {
  const trig = (STEPS[M.id] || {})[P.x + ',' + P.y]; if (trig) { held.clear(); return run(trig); }
  if (M.enc && M.enc.tiles.includes(tileAt(P.x, P.y))) {
    const groups = M.enc.groups(); if (!groups.length) return;
    if (--encCount <= 0) { encCount = rand(14, 26); held.clear(); run(() => battle(pick(groups), { bg: M.bg })); }
  }
}
function mapPress(b) {
  if (P.moving) return;
  if (b === 'a') {
    let [dx, dy] = DV[P.dir], tx = P.x + dx, ty = P.y + dy;
    if (tileAt(tx, ty) === 'B') { tx += dx; ty += dy; }
    const n = npcAt(tx, ty);
    if (n) { n.dir = [3, 2, 1, 0][P.dir]; return run(n.talk); }
    const door = (DOORS[M.id] || {})[tx + ',' + ty]; if (door) return run(door);
    const obj = (OBJS[M.id] || {})[tx + ',' + ty]; if (obj) return run(obj);
  } else if (b === 'menu' || b === 'b') run(openMenu);
}
async function run(fn) { busy++; try { await fn(); } catch (e) { console.error(e); } finally { busy--; } }

function applyItem(id, m) {
